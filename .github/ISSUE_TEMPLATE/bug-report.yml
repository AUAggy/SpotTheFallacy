name: Bug report
description: Something is broken, or the app does something it should not.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Screenshots help a lot.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what were you doing at the time?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, list the steps. If it only happened once, say so.
      placeholder: |
        1. Start Training Mode
        2. Answer the first question
        3. ...
    validations:
      required: false

  - type: input
    id: mode
    attributes:
      label: Which mode were you in?
      placeholder: Training / Challenge / Today's 5 / Quick Round / Category / Context
    validations:
      required: false

  - type: dropdown
    id: installed
    attributes:
      label: How are you using the app?
      options:
        - In a browser tab
        - Installed as an app on my phone
        - Installed as an app on my computer
        - Not sure
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 / Windows 11, Chrome 131 / ...
    validations:
      required: false
